<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auditorium Complex – 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --fg: #1d2330;
      --pn: rgba(255, 255, 255, .92);
      --bd: #c9ced8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --fg: #e8ebf2;
        --pn: rgba(24, 27, 34, .92);
        --bd: #3a4050;
      }
    }

    :root[data-theme=dark] {
      --fg: #e8ebf2;
      --pn: rgba(24, 27, 34, .92);
      --bd: #3a4050;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9cc7e8;
      color: var(--fg);
      font: 13px system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    #p {
      z-index: 5;
      position: fixed;
      top: calc(60px + env(safe-area-inset-top, 0px));
      left: 10px;
      width: 214px;
      max-height: calc(100% - 85px);
      overflow: auto;
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px;
      backdrop-filter: blur(6px);
    }

    #p.h {
      display: none;
    }

    #mb {
      position: fixed;
      z-index: 6;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    #p b {
      font-size: 14px;
    }

    #p small {
      display: block;
      opacity: .7;
      margin: 2px 0 6px;
    }

    #v {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 5px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(120, 140, 180, .2);
    }

    label {
      display: block;
      margin: 5px 0;
    }

    input[type=range] {
      width: 100%;
      margin: 2px 0;
    }

    #t {
      z-index: 5;
      position: fixed;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <button id="mb" aria-label="Control panel">
    <svg width="20" height="20" viewBox="0 0 20 20">
      <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span id="ml">Control panel</span>
  </button>
  
  <div id="p" class="h">
    <b>Auditorium Complex</b>
    <small>Phase 2 · interactive 3D</small>
    <div id="v"></div>
    <label><input type="checkbox" id="r" checked> Roof sheet</label>
    <label><input type="checkbox" id="f" checked> First floor (office + stage)</label>
    <label><input type="checkbox" id="l" checked> Landscape &amp; cars</label>
    <label>Wall transparency<input type="range" id="xr" min="0" max="90" value="0"></label>
    <label>Explode layers (lift roofs &amp; first floor)<input type="range" id="ex" min="0" max="100" value="0"></label>
    <label>Section cut height<input type="range" id="cu" min="0.6" max="9" step="0.1" value="9"></label>
    <label>Sun time (6am–6pm)<input type="range" id="tm" min="6" max="18" step="0.1" value="15"></label>
    <small>
      Hall 11.10 m wide · roof 17.98 × 14 m<br>
      Stage 6.40 × 5.16 m
    </small>
  </div>
  
  <div id="t">Drag: orbit · Wheel: zoom · Right-drag: pan</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const $ = i => document.getElementById(i);
    const PI = Math.PI;
    const R = Math.random;
    const P = 0.45;

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
    const ren = new THREE.WebGLRenderer({ antialias: true });
    ren.outputEncoding = THREE.sRGBEncoding;
    ren.shadowMap.enabled = true;
    ren.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(ren.domElement);

    const cp = new THREE.Plane(new THREE.Vector3(0, -1, 0), 9);
    ren.clippingPlanes = [cp];
    const ctl = new THREE.OrbitControls(cam, ren.domElement);
    ctl.enableDamping = true;
    ctl.maxPolarAngle = 1.55;

    /* ---------- procedural textures ---------- */
    const mk = (f, s = 256) => {
      const c = document.createElement('canvas');
      c.width = c.height = s;
      f(c.getContext('2d'), s);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 8;
      t.encoding = THREE.sRGBEncoding;
      return t;
    };

    const nz = (x, s, n, a, z = 2) => {
      for (let i = 0; i < n; i++) {
        const v = R() < 0.5 ? 0 : 255;
        x.fillStyle = `rgba(${v},${v},${v},${a * R()})`;
        x.fillRect(R() * s, R() * s, z, z);
      }
    };

    const tPaint = mk((x, s) => {
      x.fillStyle = '#f3f1ea';
      x.fillRect(0, 0, s, s);
      nz(x, s, 9000, 0.07);
    });

    const tGrass = mk((x, s) => {
      x.fillStyle = '#4d7a30';
      x.fillRect(0, 0, s, s);
      for (let i = 0; i < 6000; i++) {
        x.strokeStyle = `hsl(${80 + R() * 35},${40 + R() * 25}%,${22 + R() * 22}%)`;
        const a = R() * s, b = R() * s;
        x.beginPath();
        x.moveTo(a, b);
        x.lineTo(a + R() * 5 - 2.5, b - 3 - R() * 5);
        x.stroke();
      }
    });

    const tTile = mk((x, s) => {
      x.fillStyle = '#dedad2';
      x.fillRect(0, 0, s, s);
      nz(x, s, 3000, 0.06);
      x.fillStyle = '#a9a69f';
      for (let i = 0; i < 2; i++) {
        x.fillRect(i * s / 2, 0, 3, s);
        x.fillRect(0, i * s / 2, s, 3);
      }
    });

    const tWood = mk((x, s) => {
      for (let i = 0; i < 8; i++) {
        x.fillStyle = `hsl(25,${40 + R() * 12}%,${26 + R() * 12}%)`;
        x.fillRect(i * 32, 0, 31, s);
      }
      nz(x, s, 4000, 0.12, 3);
      x.fillStyle = '#2a170a';
      for (let i = 0; i < 8; i++) {
        x.fillRect(i * 32 + 31, 0, 1, s);
      }
    });

    const tRoof = mk((x, s) => {
      for (let i = 0; i < s; i++) {
        x.fillStyle = `hsl(212,14%,${46 + 14 * Math.sin(i / s * PI * 32)}%)`;
        x.fillRect(i, 0, 1, s);
      }
      nz(x, s, 2500, 0.08);
    });

    const tPaver = mk((x, s) => {
      x.fillStyle = '#6f6c66';
      x.fillRect(0, 0, s, s);
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          x.fillStyle = `hsl(30,4%,${52 + R() * 14}%)`;
          x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60);
        }
      }
    });

    const tGrav = mk((x, s) => {
      x.fillStyle = '#8e8b83';
      x.fillRect(0, 0, s, s);
      nz(x, s, 14000, 0.6);
    });

    const M = o => new THREE.MeshStandardMaterial(o);

    const paint = M({ map: tPaint, roughness: 0.9 });
    const tile = M({ map: tTile, roughness: 0.35 });
    const wood = M({ map: tWood, roughness: 0.6 });
    const roofM = M({ map: tRoof, roughness: 0.45, metalness: 0.35 });
    const paver = M({ map: tPaver, roughness: 0.95 });
    const grav = M({ map: tGrav, roughness: 1 });
    const frame = M({ color: 0x30343b, roughness: 0.5, metalness: 0.6 });
    const doorM = M({ color: 0x6a4327, roughness: 0.6 });
    const curt = M({ color: 0x7a1426, roughness: 0.9 });
    const tim = M({ color: 0x5b4030, roughness: 0.8 });
    const grey = M({ color: 0x85888e, roughness: 0.8 });
    const glass = new THREE.MeshPhysicalMaterial({ color: 0xa6d4ea, transparent: true, opacity: 0.38, roughness: 0.05, metalness: 0.2 });

    const tGran = mk((x, s) => {
      x.fillStyle = '#3a3e45';
      x.fillRect(0, 0, s, s);
      nz(x, s, 9000, 0.6);
    });

    const wfr = M({ color: 0x6b3f22, roughness: 0.6 });
    const blkF = M({ color: 0x14171b, roughness: 0.4, metalness: 0.5 });
    const blkD = M({ color: 0x1f1816, roughness: 0.5 });
    const ss = M({ color: 0xd3d7db, roughness: 0.2, metalness: 0.95 });
    const brnR = M({ color: 0xa8733f, roughness: 0.6 });
    const canM = M({ color: 0xe8dcae, transparent: true, opacity: 0.88, roughness: 0.7 });
    const granite = M({ map: tGran, roughness: 0.35 });

    /* ---------- helpers ---------- */
    const gRoof = new THREE.Group();
    const gF = new THREE.Group();
    const gTop = new THREE.Group();
    const gP = new THREE.Group();
    const gL = new THREE.Group();
    scene.add(gRoof, gF, gTop, gP, gL);

    function B(x0, y0, z0, x1, y1, z1, m, g) {
      const w = x1 - x0, h = y1 - y0, d = z1 - z0;
      const G = new THREE.BoxGeometry(w, h, d);
      const u = G.attributes.uv;
      const S = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let i = 0; i < 24; i++) {
        const s = S[i >> 2];
        u.setXY(i, u.getX(i) * s[0] / 2, u.getY(i) * s[1] / 2);
      }
      const o = new THREE.Mesh(G, m);
      o.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      o.castShadow = m !== glass;
      o.receiveShadow = true;
      (g || scene).add(o);
      return o;
    }

    function W(ax, c, u0, u1, y0, y1, ops, out, g) { /* wall along axis ax at fixed coord c, with openings [a,b,ya,yb,'w'|'d'|'o'] */
      const t = 0.2;
      const s = (a, b, ya, yb) => {
        if (b - a > 0.001 && yb - ya > 0.001) {
          ax == 'x' ? B(a, ya, c - t / 2, b, yb, c + t / 2, paint, g) : B(c - t / 2, ya, a, c + t / 2, yb, b, paint, g);
        }
      };
      const Q = (a, ya, b, yb, o, th, m) => ax == 'x' ? B(a, ya, c + o - th / 2, b, yb, c + o + th / 2, m, g) : B(c + o - th / 2, ya, a, c + o + th / 2, yb, b, m, g);
      
      let cur = u0;
      ops.sort((p, q) => p[0] - q[0]);

      for (const [a, b, ya, yb, k, nc, nr] of ops) {
        s(cur, a, y0, y1);
        s(a, b, y0, ya);
        s(a, b, yb, y1);
        cur = b;
        if (k == 'o') continue;
        const m = (a + b) / 2;
        if (k == 'w' || k == 'v' || k == 'b') {
          const fr = k == 'v' ? wfr : k == 'b' ? blkF : frame;
          Q(a, ya, b, yb, 0, 0.04, glass);
          Q(a, ya, b, ya + 0.05, 0, 0.09, fr);
          Q(a, yb - 0.05, b, yb, 0, 0.09, fr);
          Q(a, ya, a + 0.05, yb, 0, 0.09, fr);
          Q(b - 0.05, ya, b, yb, 0, 0.09, fr);
          if (k == 'b') {
            for (let j = 1; j < 5; j++) {
              const yy = ya + (yb - ya) * j / 5;
              Q(a, yy - 0.02, b, yy + 0.02, out * 0.04, 0.05, wfr);
            }
          } else {
            Q(m - 0.025, ya, m + 0.025, yb, 0, 0.09, fr);
          }
          if (k == 'w') {
            Q(a - 0.06, ya - 0.05, b + 0.06, ya, out * 0.1, 0.3, paint);
            Q(a - 0.15, yb + 0.05, b + 0.15, yb + 0.1, out * 0.35, 0.7, paint);
          }
        } /* w: sill + sunshade; v: wood frame; b: black frame + wood bars */
        else if (k == 'g') {
          const n = nc || 5, r = nr || 3;
          Q(a, ya, b, yb, 0, 0.04, glass);
          for (let i = 0; i <= n; i++) {
            const x = a + (b - a) * i / n;
            Q(x - 0.03, ya, x + 0.03, yb, 0, 0.1, blkF);
          }
          for (let j = 0; j <= r; j++) {
            const y = ya + (yb - ya) * j / r;
            Q(a, y - 0.03, b, y + 0.03, 0, 0.1, blkF);
          }
        } else {
          const dm = k == 'k' ? blkD : doorM;
          Q(a, ya, m - 0.01, yb, 0, 0.07, dm);
          Q(m + 0.01, ya, b, yb, 0, 0.07, dm);
        }
      }
      s(cur, u1, y0, y1);
    }

    function bm(x, z0, y0, z1, y1, w, m, g) {
      const o = new THREE.Mesh(new THREE.BoxGeometry(w, w, Math.hypot(z1 - z0, y1 - y0)), m);
      o.position.set(x, (y0 + y1) / 2, (z0 + z1) / 2);
      o.rotation.x = -Math.atan2(y1 - y0, z1 - z0);
      o.castShadow = true;
      (g || scene).add(o);
    }

    /* ---------- land (from site plan) ---------- */
    const L = [
      [-2.12, -8.9],
      [17, -8.38],
      [15.7, 16.4],
      [3.96, 16.6],
      [3.44, 29.5],
      [-5.58, 31.8],
      [-5.54, 16.6],
      [-3.29, -3.56],
      [-2.46, -3.56]
    ];
    tGrass.repeat.set(0.25, 0.25);
    const land = new THREE.Mesh(
      new THREE.ShapeGeometry(new THREE.Shape(L.map(([x, z]) => new THREE.Vector2(x, -z)))),
      M({ map: tGrass, roughness: 1 })
    );
    land.rotation.x = -PI / 2;
    land.receiveShadow = true;
    scene.add(land);

    const g2 = tGrass.clone();
    g2.needsUpdate = true;
    g2.repeat.set(40, 40);

    const out = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      M({ map: g2, color: 0xb9c9a8, roughness: 1 })
    );
    out.rotation.x = -PI / 2;
    out.position.y = -0.05;
    out.receiveShadow = true;
    scene.add(out);

    L.forEach((p, i) => {
      const q = L[(i + 1) % L.length], dx = q[0] - p[0], dz = q[1] - p[1];
      const o = new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(dx, dz), 0.9, 0.15), paint);
      o.position.set((p[0] + q[0]) / 2, 0.45, (p[1] + q[1]) / 2);
      o.rotation.y = -Math.atan2(dz, dx);
      o.castShadow = o.receiveShadow = true;
      gL.add(o);
    });

    B(-2.81, 0, 11.6, 15.17, 0.03, 16.27, paver);
    B(0.8, 0, 17, 3.4, 0.03, 29, grav);
    B(-3.8, 0, 6.2, -2.3, 0.03, 8.9, paver); /* apron, parking, unloading bay */

    const trG = new THREE.CylinderGeometry(0.12, 0.18, 1.8, 6);
    const fG = new THREE.IcosahedronGeometry(1, 1);
    const trM = M({ color: 0x5a3d28 });
    const fM = [0x2f6b2a, 0x3e7d32, 0x4a8a38].map(c => M({ color: c, roughness: 1, flatShading: true }));

    function tree(x, z, s) {
      const g = new THREE.Group();
      const t = new THREE.Mesh(trG, trM);
      const f = new THREE.Mesh(fG, fM[(R() * 3) | 0]);
      t.position.y = 0.9 * s;
      t.scale.setScalar(s);
      f.position.y = 2.6 * s;
      f.scale.set(1.3 * s, 1.5 * s, 1.3 * s);
      t.castShadow = f.castShadow = true;
      g.add(t, f);
      g.position.set(x, 0, z);
      gL.add(g);
    }

    for (let z = 17.5; z < 31; z += 1.05) tree(-4.9, z, 0.8 + R() * 0.4);
    [
      [-9, 0], [-10, 9], [-9, 21], [19, -3], [19, 9], [17, 24],
      [8, -13], [-1, -13], [-8, 35], [9, 37], [-14, 28], [22, 16]
    ].forEach(([x, z]) => tree(x, z, 1.3 + R() * 0.5));

    function car(x, z, r, c) {
      const g = new THREE.Group();
      const cm = M({ color: c, roughness: 0.3, metalness: 0.5 });
      B(-0.85, 0.25, -2, 0.85, 0.9, 2, cm, g);
      B(-0.75, 0.9, -1, 0.75, 1.4, 1, M({ color: 0x1c2530, roughness: 0.2 }), g);
      [[-0.9, -1.3], [0.7, -1.3], [-0.9, 1.1], [0.7, 1.1]].forEach(([a, b]) => B(a, 0, b, a + 0.2, 0.5, b + 0.4, frame, g));
      g.position.set(x, 0, z);
      g.rotation.y = r;
      gL.add(g);
    }

    [
      [2.3, 18.2, 0, 0xb02a2a],
      [2.3, 22.9, 0, 0x2a4f9a],
      [2.3, 27.2, 0, 0xd8d8d8],
      [10, 13, PI / 2, 0x333a44],
      [10, 15.3, PI / 2, 0xc9a227]
    ].forEach(a => car(...a));

    const frG = new THREE.BoxGeometry(2.4, 0.05, 0.4);
    const pM = M({ color: 0x3f7a35, roughness: 0.9, side: 2 });

    function palm(x, z, h) {
      const g = new THREE.Group();
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.15, h, 6), trM);
      t.position.y = h / 2;
      t.castShadow = true;
      g.add(t);
      for (let i = 0; i < 9; i++) {
        const f = new THREE.Mesh(frG, pM);
        const pv = new THREE.Group();
        f.position.x = 1.2;
        f.rotation.z = -0.35;
        f.castShadow = true;
        pv.add(f);
        pv.rotation.y = i / 9 * PI * 2;
        pv.position.y = h;
        g.add(pv);
      }
      g.position.set(x, 0, z);
      gL.add(g);
    }

    [
      [-5, -6, 9], [-6.2, 2, 11], [-5.6, 11, 8], [-4, -9.5, 10],
      [1, -11, 9], [7, -11.5, 11], [13, -11, 8], [17.5, -6, 10],
      [18, 5, 9], [-9, 16, 10]
    ].forEach(a => palm(...a)); /* coconut / areca palms around the plot */

    /* ---------- building (units: metres, floor level P, x east, z south) ---------- */
    B(0, 0, -2.4, 15.4, P, 11.6, paint);
    B(-1.7, 0, -7.86, 14, P, -2.4, paint); /* plinths */

    B(1.05, P, -2.4, 12.15, P + 0.02, 11.3, tile);
    B(0, P, -2.4, 0.85, P + 0.02, 11.55, paver);
    B(12.35, P, -2.4, 15.17, P + 0.02, 11.55, paver);
    B(0.2, P, -7.66, 3.3, P + 0.02, -2.5, tile);
    B(-1.4, P, -7.66, 0, P + 0.02, -5.86, tile);
    B(10, P, -7.66, 13.7, P + 0.02, -2.5, tile);
    B(-1.2, P, -5.76, 0, P + 0.02, -2.4, granite);

    B(3.6, P, -7.66, 9.8, 0.95, -2.5, wood);
    B(4.0, 0.95, -7.55, 9.4, 4.2, -7.5, curt); /* stage (raised 0.5 m) + curtain */

    const XT = [-2.71, 0.87, 4.44, 8, 11.56, 15.05];
    const ys = z => 5.13 - (z + 0.45) * 0.078;
    const steel = M({ color: 0x2f5fae, roughness: 0.45, metalness: 0.6 });
    const acp = M({ color: 0xdde2e8, roughness: 0.3, metalness: 0.5 });

    /* auditorium (from the engineer's plan): walls left, right and front only; entrance (left) + exit (right) gaps; open to the existing building at the back */
    W('z', 0.95, -1.4, 11.4, P, 3.4, [[0.6, 2.4, 1.3, 2.9, 'w'], [3.2, 5, 1.3, 2.9, 'w'], [5.75, 8.17, P, 3.4, 'o'], [8.9, 10.6, 1.3, 2.9, 'w']], -1);
    W('z', 12.25, 0.28, 11.4, P, 3.4, [[4.7, 6.4, 1.3, 2.9, 'w'], [7, 8.17, P, 3.4, 'o'], [8.9, 10.6, 1.3, 2.9, 'w']], 1);
    W('x', 11.3, 0.85, 12.35, P, 3.55, [[2.2, 4.2, 1.3, 2.9, 'w'], [8.2, 10.2, 1.3, 2.9, 'w']], 1);
    W('x', -0.55, 13.9, 15.17, P, 5, [], -1); /* back wall where the roof is wider than the existing building */

    const inf = (zA, zB, x) => {
      const y = z => ys(z) - 0.6;
      const s = new THREE.Shape([
        new THREE.Vector2(zA, 3.4),
        new THREE.Vector2(zB, 3.4),
        new THREE.Vector2(zB, y(zB)),
        new THREE.Vector2(zA, y(zA))
      ]);
      const o = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.2, bevelEnabled: false }), paint);
      o.rotation.y = -PI / 2;
      o.position.x = x + 0.1;
      o.castShadow = o.receiveShadow = true;
      scene.add(o);
    };

    inf(-1.4, 11.4, 0.95);
    inf(0.28, 11.4, 12.25); /* sloped wall tops under the trusses */

    for (const x of XT) {
      B(x - 0.0625, P, 11.49, x + 0.0625, 3.5, 11.615, frame); /* 6 front columns, 125x125 tube */
    }

    /* lean-to roof: 6 king-post trusses, 14 purlins, 30 mm sandwich sheet; high end on the balcony, falls to the front; ACP fascia + gutter */
    for (const x of XT) {
      bm(x, -0.45, ys(-0.45) - 0.11, 12.5, ys(12.5) - 0.11, 0.06, steel, gRoof);
      bm(x, -0.45, ys(-0.45) - 0.6, 12.5, ys(12.5) - 0.6, 0.06, steel, gRoof);
      for (let k = 0; k <= 6; k++) {
        const z = -0.45 + k * 2.158;
        B(x - 0.025, ys(z) - 0.6, z - 0.025, x + 0.025, ys(z) - 0.11, z + 0.025, steel, gRoof);
        if (k < 6) {
          const z2 = z + 2.158, a = k % 2 ? ys(z) - 0.11 : ys(z) - 0.6, b = k % 2 ? ys(z2) - 0.6 : ys(z2) - 0.11;
          bm(x, z, a, z2, b, 0.04, steel, gRoof);
        }
      }
    }

    for (let k = 0; k < 14; k++) {
      const z = -0.35 + k * 0.99;
      B(-2.81, ys(z) - 0.085, z - 0.025, 15.17, ys(z) - 0.035, z + 0.025, steel, gRoof);
    }

    {
      const sl = Math.hypot(12.95, 1.01), g = new THREE.Group();
      B(-8.99, -0.03, -sl / 2, 8.99, 0, sl / 2, roofM, g);
      g.position.set(6.18, 4.625, 6.025);
      g.rotation.x = Math.atan2(1.01, 12.95);
      gRoof.add(g);
    }

    B(-2.81, 3.45, 12.5, 15.17, 5.39, 12.55, acp, gRoof);
    B(-2.81, 3.98, 11.95, 15.17, 4.12, 12.5, grey, gRoof);

    /* entrance steps, side-door pads */
    B(-0.9, 0, 5.4, 0, 0.25, 8.5, paint);
    B(15.4, 0, 6.3, 16.2, 0.25, 8.5, paint); /* entrance + exit steps */

    /* chairs */
    {
      const cs = [];
      for (let j = 0; j < 14; j++) {
        for (let i = 0; i < 18; i++) {
          const x = 2.1 + i * 0.56, z = 0.8 + j * 0.85;
          if (Math.abs(x - 6.6) > 0.45 && !(z > 5.3 && z < 8.5) && z < 10.4) {
            cs.push([x, z]);
          }
        }
      }
      const cm = M({ color: 0x7a1f2b, roughness: 0.8 });
      const a = new THREE.InstancedMesh(new THREE.BoxGeometry(0.46, 0.08, 0.44), cm, cs.length);
      const b = new THREE.InstancedMesh(new THREE.BoxGeometry(0.46, 0.5, 0.06), cm, cs.length);
      const m4 = new THREE.Matrix4();
      cs.forEach(([x, z], i) => {
        a.setMatrixAt(i, m4.makeTranslation(x, P + 0.45, z));
        b.setMatrixAt(i, m4.makeTranslation(x, P + 0.72, z + 0.2));
      });
      a.castShadow = b.castShadow = true;
      scene.add(a, b);
    }

    /* office + stage house (ground floor) */
    W('z', 0.1, -7.76, -2.4, P, 4.45, [[-3.8, -2.9, P, 2.6, 'k'], [-6.6, -5.3, 1.6, 3, 'b']], -1);
    W('x', -7.66, 0, 3.4, P, 4.45, [[0.6, 2.8, 1.6, 3, 'b']], -1);
    W('x', -2.5, 0, 3.4, P, 4.45, [[1, 2.9, 1.6, 3, 'b']], 1);
    W('z', 3.5, -7.76, -2.4, P, 4.45, [], 1);
    W('x', -7.66, 3.4, 13.9, P, 4.45, [], -1);
    W('z', 9.9, -7.76, -2.4, P, 4.45, [[-3.7, -2.8, P, 2.6, 'k']], 1);
    W('z', 13.8, -7.76, -2.4, P, 4.45, [], 1);
    W('x', -2.5, 3.4, 10, P, 4.45, [[3.9, 9.7, 0.95, 3.7, 'g']], 1);
    W('x', -2.5, 10, 13.9, P, 4.45, [[11.1, 12.2, 1.6, 3, 'b'], [12.6, 13.8, 0.8, 3.4, 'g', 2, 2]], 1); /* stage glass wall (5x3 panes); east bay: window + glass door (interior discarded) */

    /* handicapped toilet + landing */
    W('x', -7.66, -1.6, 0, P, 4.45, [[-1.2, -0.5, 2.3, 3.2, 'b']], -1);
    W('x', -5.86, -1.6, 0, P, 4.45, [[-1.35, -0.55, P, 2.6, 'k']], 1);
    W('z', -1.5, -7.76, -5.76, P, 4.45, [], -1);

    /* first floor over office only (no floor above stage) */
    B(0, 4.45, -7.76, 13.9, 4.65, -2.4, paint);
    B(0.2, 4.65, -7.66, 13.7, 4.67, -2.5, tile);
    W('z', 0.1, -7.76, -2.4, 4.65, 7.65, [[-7.4, -5.5, 4.65, 6.8, 'o'], [-4.8, -3.7, 5.7, 6.8, 'v']], -1, gF);
    W('x', -7.66, 0, 13.9, 4.65, 7.65, [[1.8, 3.2, 5.6, 6.8, 'v'], [4, 5.4, 5.6, 6.8, 'v'], [7, 8.2, 5.6, 6.8, 'v'], [8.95, 9.65, 5.6, 6.8, 'v'], [11.4, 12.8, 5.6, 6.8, 'v']], -1, gF);
    W('x', -2.5, 0, 13.9, 4.65, 7.65, [[1.2, 3, 5.6, 6.8, 'v'], [4.9, 6.5, 4.65, 6.75, 'd'], [8.4, 9.8, 4.65, 6.75, 'd'], [11.6, 12.9, 5.6, 6.8, 'v']], 1, gF);
    W('z', 9.9, -7.76, -2.4, 4.65, 7.65, [[-4.6, -3.6, 4.65, 6.6, 'o']], 1, gP);
    W('z', 13.8, -7.76, -2.4, 4.65, 7.65, [[-6.3, -4.9, 5.6, 6.8, 'v']], 1, gF);
    W('x', -5.2, 0.1, 3.3, 4.65, 7.65, [[2.2, 3.2, 4.65, 6.6, 'o']], 1, gP);
    W('z', 3.3, -5.2, -2.5, 4.65, 7.65, [[-4.5, -3, 4.65, 6.6, 'o']], 1, gP);
    W('z', 6.4, -7.66, -2.5, 4.65, 7.65, [[-4.6, -3.6, 4.65, 6.6, 'o']], 1, gP);
    W('x', -6.1, 6.5, 8.8, 4.65, 7.65, [[7.3, 8.1, 4.65, 6.6, 'o']], 1, gP);
    W('z', 8.8, -7.66, -6.1, 4.65, 7.65, [], 1, gP);
    W('z', 1.5, -7.66, -5.3, 4.65, 7.65, [[-6.5, -5.6, 4.65, 6.7, 'd']], -1, gP);
    B(-0.35, 7.65, -8.1, 14.25, 7.85, -2.1, paint, gTop);
    B(0.2, 7.85, -7.7, 13.7, 9.4, -4.8, paint, gTop); /* roof slab + set-back raised block (photos) */

    for (let i = 0; i <= 14; i++) {
      const x = -0.35 + i * 14.6 / 14;
      B(x - 0.025, 7.5, -2.1, x + 0.025, 7.56, -0.4, blkF, gTop);
      if (i < 14) B(x + 0.03, 7.54, -2.1, x + 14.6 / 14 - 0.03, 7.57, -0.4, canM, gTop);
    }
    B(-0.35, 7.48, -0.43, 14.25, 7.56, -0.37, blkF, gTop); /* canopy over the balcony: steel frame + translucent panels */

    /* left-most stair (1.2 m) to first floor; right-hand access ramp (1.2 m) into the office varandah */
    for (let i = 0; i < 24; i++) {
      B(-2.4, 0, 2.7 - (i + 1) * 0.25, -1.2, (i + 1) * 4.65 / 24, 2.7 - i * 0.25, granite);
    }

    {
      const s = new THREE.Shape([new THREE.Vector2(2.4, 0), new THREE.Vector2(-2.4, 0), new THREE.Vector2(-2.4, P)]);
      const o = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 1.2, bevelEnabled: false }), granite);
      o.rotation.y = -PI / 2;
      o.castShadow = o.receiveShadow = true;
      scene.add(o);
    }

    B(-2.15, 4.45, -7.86, 0, 4.65, -3.24, paint);
    B(-2.15, 4.65, -7.86, 0, 4.67, -3.24, granite);
    B(-2.15, 0, -3.5, -1.95, 4.45, -3.3, paint);
    B(-2.15, 0, -5.6, -1.95, 4.45, -5.4, paint);

    for (const y of [5, 5.3, 5.65]) {
      B(-2.17, y, -7.86, -2.13, y + 0.03, -3.24, ss);
      B(-1.2, y, -3.3, 0, y + 0.03, -3.27, ss);
      B(-2.15, y, -7.88, 0, y + 0.03, -7.85, ss);
    }

    for (let z = -7.86; z <= -3.3; z += 1.15) {
      B(-2.17, 4.67, z, -2.13, 5.67, z + 0.04, ss);
    }

    for (const x of [-2.3, -1.25]) {
      for (const h of [0.35, 0.65, 0.95]) {
        bm(x, -3.3, 4.65 + h, 2.7, h, 0.035, ss);
      }
    }

    for (const x of [-2.3, -1.25]) {
      for (const i of [0, 6, 12, 18, 23]) {
        const zp = 2.7 - (i + 0.5) * 0.25, yb = (i + 1) * 4.65 / 24;
        B(x - 0.02, yb, zp - 0.02, x + 0.02, yb + 1, zp + 0.02, ss);
      }
    } /* stainless rails */

    B(-0.8, 4.2, -2.4, 14.7, 4.65, -0.5, paint);
    for (const y of [4.85, 5.15, 5.45, 5.75]) {
      B(-0.8, y, -0.56, 14.7, y + 0.04, -0.52, brnR);
      B(-0.8, y, -2.4, -0.76, y + 0.04, -0.5, brnR);
      B(14.66, y, -2.4, 14.7, y + 0.04, -0.5, brnR);
    }
    for (let i = 0; i <= 8; i++) {
      const x = -0.8 + i * 1.9375;
      B(x - 0.03, 4.65, -0.58, x + 0.03, 5.79, -0.5, brnR);
    } /* first-floor balcony: full width, thick edge, wood-colour rails */

    /* ---------- minimal furniture & fixtures ---------- */
    const cer = M({ color: 0xffffff, roughness: 0.2 });
    const chM = M({ color: 0x3d4a5c, roughness: 0.7 });
    const cabM = M({ color: 0xc9b48e, roughness: 0.7 });
    const sofaM = M({ color: 0x56708a, roughness: 0.9 });
    const bedM = M({ color: 0xece6da, roughness: 0.9 });
    const blk = M({ color: 0x1e2024, roughness: 0.5 });
    const blue = M({ color: 0x4a6fa5, roughness: 0.9 });

    const ch = (x, z, y, d, g) => {
      B(x - 0.2, y + 0.42, z - 0.2, x + 0.2, y + 0.47, z + 0.2, chM, g);
      B(x - 0.2, y + 0.47, Math.min(z + d * 0.15, z + d * 0.2), x + 0.2, y + 0.95, Math.max(z + d * 0.15, z + d * 0.2), chM, g);
      B(x - 0.03, y, z - 0.03, x + 0.03, y + 0.42, z + 0.03, frame, g);
    };

    const wc = (x, z, y, g) => {
      B(x - 0.2, y, z - 0.3, x + 0.2, y + 0.4, z + 0.3, cer, g);
      B(x - 0.17, y + 0.4, z - 0.3, x + 0.17, y + 0.85, z - 0.12, cer, g);
    };

    const sk = (x, z, y, g) => {
      B(x - 0.25, y + 0.8, z - 0.2, x + 0.25, y + 0.88, z + 0.2, cer, g);
      B(x - 0.04, y, z - 0.04, x + 0.04, y + 0.8, z + 0.04, cer, g);
    };

    W('x', -6.36, 0.1, 3.4, P, 4.45, [[0.4, 1.5, P, 2.5, 'o'], [2, 2.9, P, 2.5, 'o']], 1);
    W('z', 1.75, -7.66, -6.46, P, 4.45, [], 1); /* office toilet + wash */

    W('z', 14.55, 0.3, 4.3, P, 2.6, [[0.7, 1.5, P, 2.3, 'o'], [2.7, 3.5, P, 2.3, 'o']], 1);
    W('x', 0.3, 12.35, 14.65, P, 2.6, [], -1);
    W('x', 2.3, 12.35, 14.65, P, 2.6, [], 1);
    W('x', 4.3, 12.35, 14.65, P, 2.6, [], 1);
    B(12.3, 2.6, 0.2, 14.7, 2.75, 4.4, paint); /* wash block (right of the exit) */

    wc(2.5, -7.2, P);
    sk(0.9, -7.15, P);
    wc(-1, -7.2, P);
    sk(-0.35, -7.1, P);
    B(-1.4, P + 0.8, -6.9, -1.35, P + 0.85, -6.2, frame);
    wc(13.4, 0.9, P);
    wc(13.4, 2.9, P);

    B(1, P + 0.7, -5.6, 2.6, P + 0.75, -4.9, wood);
    B(1.05, P, -5.55, 1.15, P + 0.7, -4.95, wood);
    B(2.45, P, -5.55, 2.55, P + 0.7, -4.95, wood);
    ch(1.8, -6, P, -1);
    ch(1.8, -4.5, P, 1);
    B(0.25, P, -6, 0.7, P + 1.7, -5, cabM); /* office */

    B(5.9, 0.95, -4.9, 6.5, 1.95, -4.4, wood);
    ch(8, -6, 0.95, -1);
    ch(8.8, -6, 0.95, -1); /* stage: lectern + chairs */

    const F = (a, b, c, d, e, f, m) => B(a, b, c, d, e, f, m, gP);
    const Y = 4.67; /* first floor furniture (stays when layers lift) */

    F(0.2, Y, -5, 0.8, 5.57, -3.4, cabM);
    F(0.2, 5.57, -5, 0.8, 5.62, -3.4, blk);
    F(0.8, Y, -5, 2, 5.57, -4.4, cabM);
    F(0.8, 5.57, -5, 2, 5.62, -4.4, blk);
    F(0.3, 5.62, -4.8, 0.7, 5.66, -4.3, frame);
    F(0.3, 5.62, -4, 0.7, 5.64, -3.6, grey);
    F(0.25, Y, -3.3, 0.9, 6.45, -2.7, cer);

    F(1.7, Y, -7.45, 3.9, 5.1, -6.75, sofaM);
    F(1.7, 5.1, -7.5, 3.9, 5.65, -7.3, sofaM);
    F(2.3, Y, -6.2, 3.3, 5.1, -5.7, wood);

    F(4, 5.3, -4.8, 5.6, 5.36, -3.6, wood);
    for (const x of [4.05, 5.5]) {
      for (const z of [-4.75, -3.65]) {
        F(x, Y, z, x + 0.06, 5.3, z + 0.06, wood);
      }
    }
    for (const x of [4.4, 5.2]) {
      ch(x, -5.1, Y, -1, gP);
      ch(x, -3.3, Y, 1, gP);
    }

    F(8, Y, -5.9, 9.5, 5.1, -4, bedM);
    F(8, 5.1, -5, 9.5, 5.16, -4, blue);
    F(8, 5.1, -5.95, 9.5, 5.75, -5.85, wood);
    F(6.55, Y, -3.3, 7.55, 6.7, -2.6, cabM);

    wc(7.6, -7.2, Y, gP);
    sk(6.9, -7.1, Y, gP);
    F(11, Y, -5.9, 12.5, 5.1, -4, bedM);
    F(11, 5.1, -5, 12.5, 5.16, -4, blue);
    F(11, 5.1, -5.95, 12.5, 5.75, -5.85, wood);

    /* ---------- lights ---------- */
    const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x6b6a55, 0.6);
    const sun = new THREE.DirectionalLight(0xfff1dc, 1.1);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);

    const sc = sun.shadow.camera;
    sc.left = sc.bottom = -32;
    sc.right = sc.top = 32;
    sc.near = 1;
    sc.far = 150;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    sun.target.position.set(5, 0, 5);

    scene.add(hemi, sun, sun.target, new THREE.AmbientLight(0xffffff, 0.25));

    [
      [6.6, 3.2, 2, 0.6],
      [6.6, 3.2, 8, 0.5],
      [6.7, 3.1, -5, 0.5],
      [1.7, 3, -5, 0.4],
      [5, 6.8, -5, 0.5],
      [11.9, 3.3, -5, 0.4],
      [11.9, 6.8, -5, 0.4]
    ].forEach(([x, y, z, i]) => {
      const l = new THREE.PointLight(0xffefd0, i, 16);
      l.position.set(x, y, z);
      scene.add(l);
    });

    function sunT(h) {
      const a = (h - 6) / 12 * PI, s = Math.sin(a);
      sun.position.set(5 + Math.cos(a) * 45, s * 40 + 3, 27);
      sun.intensity = 0.3 + s * 0.9;
      hemi.intensity = 0.3 + s * 0.35;
      const c = new THREE.Color().setHSL(0.58, 0.5, 0.5 + 0.2 * s);
      scene.background = c;
      scene.fog = new THREE.Fog(c, 90, 280);
    }

    /* ---------- UI ---------- */
    const V = {
      Aerial: [[-16, 18, 34], [5, 2, 3]],
      Front: [[6.5, 4, 34], [6.5, 3.5, 3]],
      'Inside hall': [[6.6, 2, 10.7], [6.6, 2.4, -1], 1],
      Stage: [[6.5, 2.6, -4.2], [5.7, 1.9, 8], 1],
      'Rear / office': [[10, 8, -22], [3, 3, -4]],
      'Plan view': [[5.7, 42, 5.9], [5.7, 0, 5.5]],
      'Stair & ramp': [[-8, 4.5, 9], [-1.2, 1.5, -1.5]]
    };

    let tw = null;

    function go(n) {
      const [p, t, fp] = V[n], p1 = new THREE.Vector3(...p), t1 = new THREE.Vector3(...t);
      if (fp) t1.sub(p1).normalize().multiplyScalar(0.5).add(p1);
      tw = { p0: cam.position.clone(), t0: ctl.target.clone(), p1, t1, k: 0 };
      ctl.rotateSpeed = fp ? -0.45 : 0.8;
      ctl.minDistance = fp ? 0.05 : 2;
    }

    Object.keys(V).forEach(n => {
      const b = document.createElement('button');
      b.textContent = n;
      b.onclick = () => go(n);
      $('v').appendChild(b);
    });

    $('mb').onclick = () => {
      const h = $('p').classList.toggle('h');
      $('ml').style.display = h ? 'inline' : 'none';
    };

    $('r').onchange = e => gRoof.visible = e.target.checked;
    $('f').onchange = e => gF.visible = gTop.visible = gP.visible = e.target.checked;
    $('l').onchange = e => gL.visible = e.target.checked;

    $('xr').oninput = e => {
      const v = 1 - e.target.value / 100;
      paint.transparent = v < 1;
      paint.opacity = v;
      paint.depthWrite = v >= 1;
      paint.needsUpdate = true;
    };

    $('ex').oninput = e => {
      const k = e.target.value / 100;
      gRoof.position.y = 6 * k;
      gF.position.y = 4 * k;
      gTop.position.y = 8 * k;
    };

    $('cu').oninput = e => cp.constant = +e.target.value;
    $('tm').oninput = e => sunT(+e.target.value);

    function rs() {
      ren.setPixelRatio(Math.min(devicePixelRatio, 2));
      ren.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
    }

    addEventListener('resize', rs);
    rs();
    sunT(15);
    cam.position.set(-16, 18, 34);
    ctl.target.set(5, 2, 3);

    let last = performance.now();

    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (tw) {
        tw.k = Math.min(1, tw.k + dt * 1.2);
        const e = tw.k * tw.k * (3 - 2 * tw.k);
        cam.position.lerpVectors(tw.p0, tw.p1, e);
        ctl.target.lerpVectors(tw.t0, tw.t1, e);
        if (tw.k >= 1) tw = null;
      }
      ctl.update();
      ren.render(scene, cam);
    })(performance.now());
  </script>
</body>
</html>
